<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parkd-In | Predictive Parking Assistant</title>
    <meta
      name="description"
      content="Predictive street parking availability in London. Find your spot with ease using our real-time heuristic probability engine."
    />
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Mapbox GL JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="logo">
        <span class="logo-text">Parkd-In</span>
        <span class="logo-accent">PREDICTIVE</span>
      </div>
      <div class="status-badge" id="app-status">
        <span class="status-dot green"></span>
        <span class="status-label">Live Parking Data</span>
      </div>
    </header>

    <main id="map-container">
      <div id="map"></div>

      <!-- PH6-042 — Probability legend with gradient bar matching engine colors -->
      <div
        id="legend"
        style="
          position: fixed;
          bottom: 40px;
          right: 10px;
          background: white;
          padding: 8px;
          border-radius: 4px;
          font-size: 12px;
          z-index: 10;
          font-family: 'Inter', sans-serif;
        "
      >
        <div
          style="
            background: linear-gradient(to right, #cc0000, #ffaa00, #00aa00);
            height: 16px;
            width: 120px;
            border-radius: 2px;
          "
        ></div>
        <div
          style="
            display: flex;
            justify-content: space-between;
            width: 120px;
            margin-top: 2px;
          "
        >
          <span>Low</span>
          <span>Med</span>
          <span>High</span>
        </div>
        <div
          style="
            display: flex;
            justify-content: space-between;
            width: 120px;
            font-size: 10px;
            color: #666;
          "
        >
          <span><30%</span>
          <span>30–70%</span>
          <span>>70%</span>
        </div>
      </div>

      <!-- PH6-041 — Time window selector -->
      <div
        id="window-panel"
        style="
          position: fixed;
          top: 10px;
          right: 10px;
          z-index: 10;
          background: rgba(15, 23, 42, 0.92);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          border: 1px solid rgba(255, 255, 255, 0.12);
          border-radius: 8px;
          padding: 8px 14px;
          color: #f8fafc;
          font-size: 13px;
          font-family: 'Inter', sans-serif;
        "
      >
        <label for="window-select">Predict for: </label>
        <select
          id="window-select"
          style="
            background: rgba(30, 41, 59, 0.9);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            padding: 2px 6px;
            font-family: 'Inter', sans-serif;
          "
        >
          <option value="5">5 min</option>
          <option value="10" selected>10 min</option>
          <option value="15">15 min</option>
        </select>
      </div>

      <div class="map-overlay info-card glass" id="info-overlay">
        <div class="card-content">
          <h2>Predictive Advantage</h2>
          <p>
            Our heuristic engine analyzes real-time traffic history and
            crowdsourced events to predict where you'll find a spot next.
          </p>
          <div class="stats-row">
            <div class="stat">
              <span class="stat-value">84%</span>
              <span class="stat-label">Accuracy</span>
            </div>
            <div class="stat">
              <span class="stat-value">5m</span>
              <span class="stat-label">Refresh</span>
            </div>
          </div>
        </div>
      </div>

      <div
        id="report-panel"
        style="
          position: fixed;
          bottom: 40px;
          left: 50%;
          transform: translateX(-50%);
          display: flex;
          gap: 12px;
          z-index: 10;
        "
      >
        <button
          id="btn-parked"
          style="
            background: #43a047;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
          "
        >
          I Parked Here
        </button>
        <button
          id="btn-left"
          style="
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
          "
        >
          I Left a Space
        </button>
        <button
          id="btn-searching"
          style="
            background: #ef4444;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
          "
        >
          Nothing Free Here
        </button>
      </div>

      <div
        id="report-status"
        style="
          display: none;
          position: fixed;
          bottom: 100px;
          left: 50%;
          transform: translateX(-50%);
          background: rgba(15, 23, 42, 0.92);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          border: 1px solid rgba(255, 255, 255, 0.12);
          border-radius: 8px;
          padding: 10px 20px;
          color: #f8fafc;
          font-size: 14px;
          font-family: 'Inter', sans-serif;
          z-index: 10;
        "
      ></div>
    </main>

    <!-- PH6-041 — Time window selector HTML. -->
    <script src="map.js"></script>
  </body>
</html>
