name: Refresh Tiles

on:
  schedule:
    - cron: "0 6 * * *"   # Every day at 06:00 UTC
  workflow_dispatch:        # Also allows manual trigger from GitHub

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install geopandas mapbox-vector-tile pyarrow pyproj shapely

      - name: Generate tiles
        run: python generate_tiles_local.py

      - name: Commit and push updated tiles
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/tiles/
          git diff --cached --quiet || git commit -m "chore: refresh parking tiles [skip ci]"
          git push
