<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parkd-In | Predictive Parking Assistant</title>
    <meta
      name="description"
      content="Predictive street parking availability in London. Tap the map or use GPS to find the best spot near your destination."
    />
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Mapbox GL JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <!-- ------------------------------------------------------------------ -->
    <!-- Header                                                               -->
    <!-- ------------------------------------------------------------------ -->
    <header class="app-header">
      <div class="logo">
        <span class="logo-text">Parkd-In</span>
        <span class="logo-accent">PREDICTIVE</span>
      </div>
      <div class="status-badge" id="app-status">
        <span class="status-dot green"></span>
        <span class="status-label">Live Predictions</span>
      </div>
    </header>

    <!-- ------------------------------------------------------------------ -->
    <!-- Map                                                                  -->
    <!-- ------------------------------------------------------------------ -->
    <main id="map-container">
      <div id="map"></div>

      <!-- ---------------------------------------------------------------- -->
      <!-- Top-left: time window selector                                    -->
      <!-- ---------------------------------------------------------------- -->
      <div id="window-panel">
        <label for="window-select">Available in</label>
        <select id="window-select">
          <option value="5">5 min</option>
          <option value="10" selected>10 min</option>
          <option value="15">15 min</option>
        </select>
        <button id="btn-overlay" class="overlay-toggle">Show all roads</button>
      </div>

      <!-- ---------------------------------------------------------------- -->
      <!-- Bottom: tap-to-search hint (hidden once search centre is set)    -->
      <!-- ---------------------------------------------------------------- -->
      <div id="search-hint">
        <span>&#8982;</span> Tap the map or press GPS to find parking nearby
      </div>

      <!-- ---------------------------------------------------------------- -->
      <!-- Recommendations panel (slides up after search centre is set)     -->
      <!-- ---------------------------------------------------------------- -->
      <div id="recommendations-panel">
        <div id="rec-header">
          <span id="rec-title">Nearest parking</span>
          <span id="rec-subtitle">500 m radius</span>
        </div>
        <ul id="rec-list"></ul>
      </div>

      <!-- ---------------------------------------------------------------- -->
      <!-- Bottom-sheet: segment detail (slides up on marker / list tap)    -->
      <!-- ---------------------------------------------------------------- -->
      <div id="detail-sheet">
        <button id="sheet-close" aria-label="Close">&times;</button>

        <div id="sheet-header">
          <div id="sheet-street">—</div>
          <div id="sheet-walk"></div>
        </div>

        <div id="sheet-predictions">
          <div class="pred-col">
            <div class="pred-label">5 min</div>
            <div class="pred-val" id="sheet-5min">—</div>
          </div>
          <div class="pred-col pred-col--mid">
            <div class="pred-label">10 min</div>
            <div class="pred-val" id="sheet-10min">—</div>
          </div>
          <div class="pred-col">
            <div class="pred-label">15 min</div>
            <div class="pred-val" id="sheet-15min">—</div>
          </div>
        </div>

        <div id="sheet-hint-text"></div>

        <div id="sheet-actions">
          <a id="sheet-navigate" href="#" target="_blank" rel="noopener" class="btn-nav">
            Navigate here
          </a>
          <div id="sheet-report-btns">
            <button id="btn-parked"    class="btn-report btn-parked">I Parked</button>
            <button id="btn-left"      class="btn-report btn-left">I Left</button>
            <button id="btn-searching" class="btn-report btn-searching">Still Busy</button>
          </div>
        </div>
      </div>

      <!-- ---------------------------------------------------------------- -->
      <!-- Report status toast                                               -->
      <!-- ---------------------------------------------------------------- -->
      <div id="report-status"></div>

    </main>

    <script src="map.js"></script>
  </body>
</html>
